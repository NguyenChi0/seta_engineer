# Nginx example for SETA production
# - Static assets served directly from app/dist
# - /api proxied to Express backend
# - /robots.txt and /sitemap.xml proxied to backend (dynamic sitemap)
# - HTML routes proxied to backend prerender when SERVE_FRONTEND=1

upstream seta_backend {
  server 127.0.0.1:4001;
}

server {
  listen 443 ssl http2;
  server_name www.seta-eng.co.jp seta-eng.co.jp;

  root /var/www/seta-engineer/app/dist;
  index index.html;

  # Redirect non-www to www (optional — adjust if apex is canonical)
  if ($host = seta-eng.co.jp) {
    return 301 https://www.seta-eng.co.jp$request_uri;
  }

  location = /robots.txt {
    proxy_pass http://seta_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /sitemap.xml {
    proxy_pass http://seta_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://seta_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/uploads/ {
    proxy_pass http://seta_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Static files with cache
  location ~* \.(js|css|png|jpg|jpeg|gif|webp|svg|ico|woff2?|mp4|webm)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location /content/ {
    try_files $uri =404;
    expires 1d;
  }

  location /assets/ {
    try_files $uri =404;
    expires 30d;
  }

  # Pre-rendered HTML from Express (SERVE_FRONTEND=1 on backend)
  location / {
    proxy_pass http://seta_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

